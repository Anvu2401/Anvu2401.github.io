<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Thử in – App order</title>
<style>
  :root { --bg:#fff8f0; --card:#fff; --ink:#3b2a20; --muted:#8a7366; --accent:#c8743a; --ok:#2f8f5b; --err:#c0392b; }
  * { box-sizing: border-box; }
  body { margin:0; font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; background:var(--bg); color:var(--ink); }
  main { max-width:560px; margin:0 auto; padding:20px 16px 40px; }
  h1 { font-size:22px; margin:4px 0; }
  p.sub { margin:0 0 16px; color:var(--muted); font-size:14px; line-height:1.45; }
  .card { background:var(--card); border-radius:16px; padding:16px; margin-bottom:12px; box-shadow:0 1px 3px rgba(0,0,0,.06); }
  .card h2 { font-size:15px; margin:0 0 6px; color:var(--muted); font-weight:600; }
  .status { font-weight:700; font-size:16px; }
  .status.ok { color:var(--ok); } .status.err { color:var(--err); }
  #devinfo { font-size:13px; color:var(--muted); margin-top:4px; }
  button { display:block; width:100%; padding:14px; margin:8px 0 0; border:0; border-radius:12px; font-size:16px; font-weight:600; background:var(--accent); color:#fff; }
  button.secondary { background:#efe2d6; color:var(--ink); }
  button:disabled { opacity:.4; }
  label { font-size:14px; color:var(--muted); }
  select { width:100%; padding:10px; font-size:16px; border-radius:10px; border:1px solid #e3d3c5; margin-top:4px; background:#fff; color:var(--ink); }
  #log { font-family: ui-monospace, Menlo, Consolas, monospace; font-size:12px; white-space:pre-wrap; color:#5b4a40; max-height:260px; overflow:auto; margin:0; }
  #preview canvas { width:100%; border:1px dashed #d9c6b5; border-radius:8px; margin-top:8px; background:#fff; }
  .row2 { display:flex; gap:8px; } .row2 button { flex:1; }
</style>
</head>
<body>
<main>
  <h1>🖨️ Thử in cho app order <small style="font-size:13px;color:var(--muted)">· bản 2</small></h1>
  <p class="sub">Mở trang này bằng <b>Google Chrome</b> trên máy quầy, máy in đã cắm USB và bật nguồn. Bấm lần lượt từ trên xuống.</p>

  <div class="card">
    <h2>Trạng thái</h2>
    <div id="status" class="status">Đang kiểm tra…</div>
    <div id="devinfo"></div>
  </div>

  <div class="card">
    <label for="paper">Khổ giấy máy in</label>
    <select id="paper">
      <option value="576">80 mm (phổ biến ở quầy)</option>
      <option value="384">58 mm (máy in nhỏ)</option>
    </select>
    <button id="btnConnect">1. Kết nối máy in</button>
  </div>

  <div class="card">
    <button id="btnCompare" disabled>In mẫu so sánh 3 mức độ đậm</button>
    <div style="margin-top:12px"><label for="level">Độ đậm dùng cho phiếu và bill</label>
    <select id="level">
      <option value="0">Mức 1 – mảnh (như lần in đầu)</option>
      <option value="1" selected>Mức 2 – đậm vừa</option>
      <option value="2">Mức 3 – rất đậm</option>
    </select></div>
  </div>

  <div class="card">
    <button id="btnPhieu" disabled>2. In thử phiếu pha chế</button>
    <button id="btnBill" disabled>3. In thử bill</button>
    <button id="btnAuto" disabled>4. Thử in tự động (sau 5 giây, không chạm)</button>
    <div class="row2">
      <button id="prevPhieu" class="secondary">Xem trước phiếu</button>
      <button id="prevBill" class="secondary">Xem trước bill</button>
    </div>
  </div>

  <div class="card" id="preview"><h2>Bản in gần nhất</h2><div id="previewBox" style="color:var(--muted);font-size:14px">Chưa có</div></div>

  <div class="card">
    <h2>Nhật ký</h2>
    <pre id="log"></pre>
  </div>
</main>

<script>
const $ = s => document.querySelector(s);
let printer = null; // { device, ep, iface }

function log(msg) {
  const t = new Date().toLocaleTimeString('vi-VN', { hour12: false });
  $('#log').textContent = `[${t}] ${msg}\n` + $('#log').textContent;
}
function setStatus(text, cls) { const el = $('#status'); el.textContent = text; el.className = 'status ' + (cls || ''); }
function enablePrint(on) { ['#btnPhieu', '#btnBill', '#btnAuto', '#btnCompare'].forEach(id => $(id).disabled = !on); }
function hex(n) { return '0x' + n.toString(16).padStart(4, '0'); }
function vnd(n) { return n.toLocaleString('vi-VN'); }
function now() {
  const d = new Date(), p = n => String(n).padStart(2, '0');
  return `${p(d.getDate())}/${p(d.getMonth() + 1)}/${d.getFullYear()} ${p(d.getHours())}:${p(d.getMinutes())}`;
}

/* ---------- Kết nối USB ---------- */
async function openDevice(device) {
  await device.open();
  if (device.configuration === null) await device.selectConfiguration(1);
  let pick = null;
  for (const iface of device.configuration.interfaces) {
    for (const alt of iface.alternates) {
      const ep = alt.endpoints.find(e => e.direction === 'out' && e.type === 'bulk');
      if (!ep) continue;
      const cand = { iface: iface.interfaceNumber, alt: alt.alternateSetting, ep: ep.endpointNumber, cls: alt.interfaceClass };
      if (!pick || (cand.cls === 7 && pick.cls !== 7)) pick = cand; // ưu tiên lớp "máy in" (7)
    }
  }
  if (!pick) throw new Error('Không tìm thấy cổng gửi dữ liệu trên thiết bị này — có thể đây không phải máy in.');
  try { await device.claimInterface(pick.iface); }
  catch (e) { throw new Error('Không giữ được máy in. Có thể phần mềm bán hàng cũ đang dùng máy in — hãy tắt hẳn app đó rồi thử lại. (' + e.message + ')'); }
  if (pick.alt !== 0) await device.selectAlternateInterface(pick.iface, pick.alt);
  printer = { device, ep: pick.ep, iface: pick.iface };
  const name = [device.manufacturerName, device.productName].filter(Boolean).join(' ') || 'Máy in USB';
  const ids = `VID ${hex(device.vendorId)} · PID ${hex(device.productId)}`;
  setStatus('✅ Đã kết nối: ' + name, 'ok');
  $('#devinfo').textContent = ids + (pick.cls === 7 ? ' · nhận diện là máy in' : ` · lớp thiết bị ${pick.cls}`);
  log('Kết nối thành công: ' + name + ' (' + ids + ')');
  enablePrint(true);
}

async function send(bytes) {
  if (!printer) throw new Error('Chưa kết nối máy in.');
  const CHUNK = 4096;
  for (let i = 0; i < bytes.length; i += CHUNK) {
    const r = await printer.device.transferOut(printer.ep, bytes.subarray(i, i + CHUNK));
    if (r.status !== 'ok') throw new Error('Gửi dữ liệu lỗi: ' + r.status);
  }
}

/* ---------- Vẽ phiếu thành ảnh (để tiếng Việt luôn đúng dấu) ---------- */
function wrap(ctx, text, maxW) {
  const words = String(text).split(' '), lines = [];
  let cur = '';
  for (const w of words) {
    const t = cur ? cur + ' ' + w : w;
    if (!cur || ctx.measureText(t).width <= maxW) cur = t; else { lines.push(cur); cur = w; }
  }
  if (cur) lines.push(cur);
  return lines.length ? lines : [''];
}

/* Độ đậm: độ dày nét chữ, viền tô thêm quanh chữ, và ngưỡng đổi điểm xám thành chấm đen */
const LEVELS = [
  { normal: '400', bold: '700', stroke: 0,   thr: 150 }, // Mức 1: như bản đầu
  { normal: '600', bold: '800', stroke: 0.8, thr: 195 }, // Mức 2
  { normal: '700', bold: '900', stroke: 1.2, thr: 210 }, // Mức 3
];
function binarize(c, thr) {
  const ctx = c.getContext('2d'), im = ctx.getImageData(0, 0, c.width, c.height), d = im.data;
  for (let i = 0; i < d.length; i += 4) {
    const v = 0.299 * d[i] + 0.587 * d[i + 1] + 0.114 * d[i + 2] < thr ? 0 : 255;
    d[i] = d[i + 1] = d[i + 2] = v; d[i + 3] = 255;
  }
  ctx.putImageData(im, 0, 0);
}

function renderReceipt(blocks, levelIdx) {
  const L = LEVELS[levelIdx ?? parseInt($('#level').value, 10)];
  const W = parseInt($('#paper').value, 10);
  const s = W / 576, pad = Math.round(10 * s);
  const font = (size, bold) => `${bold ? L.bold : L.normal} ${Math.round(size * s)}px Roboto, "Noto Sans", Arial, sans-serif`;
  const c = document.createElement('canvas'), ctx = c.getContext('2d');
  const ops = [];
  let y = pad;
  for (const b of blocks) {
    if (b.type === 'gap') { y += Math.round((b.h || 12) * s); continue; }
    if (b.type === 'line') { ops.push({ type: 'line', y: y + Math.round(8 * s), dash: b.dash }); y += Math.round(18 * s); continue; }
    const size = b.size || 26, lh = Math.round(size * 1.35 * s), base = Math.round(lh * 0.76);
    const f = font(size, b.bold);
    ctx.font = f;
    const indent = Math.round((b.indent || 0) * s);
    if (b.type === 'row') {
      const rightW = ctx.measureText(b.right).width;
      const lines = wrap(ctx, b.left, W - 2 * pad - indent - rightW - Math.round(16 * s));
      lines.forEach((ln, i) => ops.push({ type: 'text', text: ln, x: pad + indent, y: y + lh * i + base, font: f, align: 'left' }));
      ops.push({ type: 'text', text: b.right, x: W - pad, y: y + base, font: f, align: 'right' });
      y += lh * lines.length;
      continue;
    }
    for (const ln of wrap(ctx, b.text, W - 2 * pad - indent)) {
      const x = b.align === 'center' ? W / 2 : b.align === 'right' ? W - pad : pad + indent;
      ops.push({ type: 'text', text: ln, x, y: y + base, font: f, align: b.align || 'left' });
      y += lh;
    }
  }
  y += pad;
  c.width = W; c.height = Math.ceil(y / 8) * 8;
  ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, c.width, c.height);
  ctx.fillStyle = '#000'; ctx.strokeStyle = '#000';
  for (const o of ops) {
    if (o.type === 'line') {
      ctx.lineWidth = Math.max(2, Math.round(2 * s));
      ctx.setLineDash(o.dash ? [Math.round(8 * s), Math.round(6 * s)] : []);
      ctx.beginPath(); ctx.moveTo(pad, o.y); ctx.lineTo(W - pad, o.y); ctx.stroke();
    } else {
      ctx.font = o.font; ctx.textAlign = o.align; ctx.textBaseline = 'alphabetic';
      ctx.fillText(o.text, o.x, o.y);
      if (L.stroke > 0) {
        ctx.setLineDash([]); ctx.lineJoin = 'round';
        ctx.lineWidth = L.stroke * s; ctx.strokeText(o.text, o.x, o.y);
      }
    }
  }
  binarize(c, L.thr); // xem trước = đúng những chấm sẽ in ra
  return c;
}

/* Một dải giấy in 3 mức độ đậm nối nhau để so sánh */
function sampleBlocks(i) {
  return [
    { text: `MỨC ${i + 1}` + (i === 0 ? ' (như lần in đầu)' : ''), size: 30, bold: true, align: 'center' },
    { type: 'line' },
    { text: '2 × Trà sữa trân châu đường đen', size: 32, bold: true },
    { text: '+ Kem cheese', size: 28, indent: 40 },
    { text: '• 50% Đường · 70% Đá', size: 28, indent: 40 },
    { type: 'row', left: '1 × Trà đào cam sả', right: '35.000', size: 28 },
    { text: 'Thử dấu: ăằắẳẵặ âầấẩẫậ đ êềếểễệ ôồốổỗộ ơờớởỡợ ưừứửữự', size: 22 },
    { type: 'gap', h: 30 },
  ];
}
function compareCanvas() {
  const parts = [0, 1, 2].map(i => renderReceipt(sampleBlocks(i), i));
  const W = parts[0].width, H = parts.reduce((a, p) => a + p.height, 0);
  const c = document.createElement('canvas');
  c.width = W; c.height = Math.ceil(H / 8) * 8;
  const ctx = c.getContext('2d');
  ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, W, c.height);
  let y = 0;
  for (const p of parts) { ctx.drawImage(p, 0, y); y += p.height; }
  return c;
}

/* Ảnh -> lệnh ESC/POS (in ảnh raster GS v 0), rồi đẩy giấy và cắt */
function canvasToEscPos(c) {
  const W = c.width, H = c.height, bpr = W / 8;
  const px = c.getContext('2d').getImageData(0, 0, W, H).data;
  const out = [0x1B, 0x40]; // ESC @ : khởi tạo máy in
  const BAND = 128;         // in từng dải 128 dòng cho máy in bộ nhớ nhỏ
  for (let y0 = 0; y0 < H; y0 += BAND) {
    const h = Math.min(BAND, H - y0);
    out.push(0x1D, 0x76, 0x30, 0x00, bpr & 0xFF, (bpr >> 8) & 0xFF, h & 0xFF, (h >> 8) & 0xFF);
    for (let y = y0; y < y0 + h; y++) {
      for (let bx = 0; bx < bpr; bx++) {
        let byte = 0;
        for (let bit = 0; bit < 8; bit++) {
          const i = (y * W + bx * 8 + bit) * 4;
          if (px[i] < 128) byte |= 0x80 >> bit; // ảnh đã được đổi sang đen/trắng lúc vẽ
        }
        out.push(byte);
      }
    }
  }
  out.push(0x1B, 0x64, 0x02);       // đẩy giấy 2 dòng
  out.push(0x1D, 0x56, 0x42, 0x00); // cắt giấy (máy không có dao cắt sẽ bỏ qua)
  return new Uint8Array(out);
}

/* ---------- Nội dung mẫu ---------- */
const ORDER = [
  { qty: 2, name: 'Nâu đá', price: 25000, opts: ['50% Đá'] },
  { qty: 1, name: 'Trà đào cam sả', price: 35000, opts: ['70% Đường'] },
  { qty: 1, name: 'Trà sữa trân châu đường đen', price: 35000, opts: ['50% Đường'], toppings: [{ name: 'Kem cheese', price: 10000 }] },
];

function phieuBlocks() {
  const b = [
    { text: 'PHIẾU PHA CHẾ', size: 40, bold: true, align: 'center' },
    { text: 'Đơn #023 · Bàn 5', size: 36, bold: true, align: 'center' },
    { text: now() + ' · Thu ngân', size: 24, align: 'center' },
    { type: 'line' },
  ];
  for (const it of ORDER) {
    b.push({ text: `${it.qty} × ${it.name}`, size: 32, bold: true });
    for (const t of it.toppings || []) b.push({ text: '+ ' + t.name, size: 28, indent: 40 });
    for (const o of it.opts || []) b.push({ text: '• ' + o, size: 28, indent: 40 });
    b.push({ type: 'gap', h: 6 });
  }
  b.push({ type: 'line', dash: true });
  b.push({ text: 'Ghi chú: Mang về', size: 28, bold: true });
  b.push({ type: 'gap', h: 10 });
  b.push({ text: 'Thử dấu: ăằắẳẵặ âầấẩẫậ đ êềếểễệ ôồốổỗộ ơờớởỡợ ưừứửữự', size: 22 });
  return b;
}

function billBlocks() {
  const b = [
    { text: 'AN COFFEE & TEA', size: 42, bold: true, align: 'center' },
    { text: 'Cơ sở Hải An – Hải Phòng', size: 24, align: 'center' },
    { type: 'line' },
    { text: 'HOÁ ĐƠN THANH TOÁN', size: 32, bold: true, align: 'center' },
    { text: 'Đơn #023 · Bàn 5 · ' + now(), size: 24, align: 'center' },
    { type: 'line', dash: true },
  ];
  let total = 0;
  for (const it of ORDER) {
    const line = it.qty * it.price; total += line;
    b.push({ type: 'row', left: `${it.qty} × ${it.name}`, right: vnd(line), size: 28 });
    for (const t of it.toppings || []) { total += t.price * it.qty; b.push({ type: 'row', left: '+ ' + t.name, right: vnd(t.price * it.qty), size: 24, indent: 36 }); }
  }
  b.push({ type: 'line' });
  b.push({ type: 'row', left: 'TỔNG CỘNG', right: vnd(total) + 'đ', size: 34, bold: true });
  b.push({ type: 'gap', h: 18 });
  b.push({ text: 'Cảm ơn quý khách – hẹn gặp lại!', size: 26, align: 'center' });
  return b;
}

/* ---------- Thao tác ---------- */
function showPreview(canvas) { const box = $('#previewBox'); box.innerHTML = ''; box.appendChild(canvas); }

async function doPrint(kind) {
  const canvas = kind === 'compare' ? compareCanvas() : renderReceipt(kind === 'bill' ? billBlocks() : phieuBlocks());
  showPreview(canvas);
  const bytes = canvasToEscPos(canvas);
  const t0 = performance.now();
  try {
    await send(bytes);
    log(`Đã gửi ${kind === 'bill' ? 'bill' : kind === 'compare' ? 'mẫu so sánh độ đậm' : 'phiếu pha chế'} (${(bytes.length / 1024).toFixed(1)} KB, ${Math.round(performance.now() - t0)} ms).`);
  } catch (e) { log('Lỗi khi in: ' + e.message); setStatus('Lỗi khi in — xem nhật ký', 'err'); }
}

function init() {
  $('#prevPhieu').onclick = () => showPreview(renderReceipt(phieuBlocks()));
  $('#prevBill').onclick = () => showPreview(renderReceipt(billBlocks()));

  if (!window.isSecureContext) { setStatus('Trang phải mở qua https:// (ví dụ GitHub Pages).', 'err'); $('#btnConnect').disabled = true; return; }
  if (!('usb' in navigator)) { setStatus('Trình duyệt này không hỗ trợ kết nối USB. Hãy mở bằng Google Chrome (bản mới).', 'err'); $('#btnConnect').disabled = true; return; }
  setStatus('Chưa kết nối máy in');

  $('#btnConnect').onclick = async () => {
    try { await openDevice(await navigator.usb.requestDevice({ filters: [] })); }
    catch (e) {
      if (e.name === 'NotFoundError') log('Chưa chọn thiết bị nào.');
      else { setStatus('Lỗi kết nối — xem nhật ký', 'err'); log('Lỗi: ' + e.message); }
    }
  };
  $('#btnCompare').onclick = () => doPrint('compare');
  $('#btnPhieu').onclick = () => doPrint('phieu');
  $('#btnBill').onclick = () => doPrint('bill');
  $('#btnAuto').onclick = () => {
    let n = 5;
    $('#btnAuto').disabled = true;
    const tick = setInterval(() => {
      n--;
      $('#btnAuto').textContent = n > 0 ? `Sẽ tự in sau ${n} giây…` : '4. Thử in tự động (sau 5 giây, không chạm)';
      if (n <= 0) { clearInterval(tick); $('#btnAuto').disabled = !printer; log('Thử in tự động (giống khi có đơn mới từ điện thoại)…'); doPrint('phieu'); }
    }, 1000);
  };

  navigator.usb.addEventListener('connect', e => {
    log('Máy in vừa được cắm vào.');
    if (!printer) openDevice(e.device).catch(err => log('Lỗi: ' + err.message));
  });
  navigator.usb.addEventListener('disconnect', e => {
    if (printer && e.device === printer.device) { printer = null; enablePrint(false); setStatus('Máy in đã bị rút hoặc tắt.', 'err'); log('Mất kết nối máy in.'); }
  });

  navigator.usb.getDevices().then(async devices => {
    if (!devices.length) { log('Chưa có máy in nào được cho phép trước đó. Bấm "1. Kết nối máy in".'); return; }
    log('Thấy máy in đã cho phép trước đó, đang tự kết nối lại…');
    try { await openDevice(devices[0]); log('→ Tự kết nối lại được khi mở trang: app order sẽ in mà không cần bấm gì.'); }
    catch (e) { log('Tự kết nối lại thất bại: ' + e.message); }
  });
}
init();
</script>
</body>
</html>
